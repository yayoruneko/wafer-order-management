# SonarQube scanner config for the frontend.
# Defaults assume a SonarQube running on localhost:9000.
# Override via env vars on CI, e.g. SONAR_HOST_URL, SONAR_TOKEN.

sonar.projectKey=woms-frontend
sonar.projectName=WOMS Frontend
sonar.organization=yayoruneko

# Source layout
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.{js,jsx},src/**/*.integration.test.{js,jsx}

# What to skip from coverage / duplication
# (Pages, i18n dictionaries, sample data, styles, asset wrappers, and trivial
# leaf UI primitives don't carry testable logic.)
sonar.exclusions=src/**/*.test.{js,jsx},src/**/*.integration.test.{js,jsx},src/test/**,src/data/**,src/main.jsx,src/i18n/dictionaries/**,src/pages/**,src/styles/**,src/assets/**,src/components/createOrder/Spinner.jsx,src/components/createOrder/CustomerAvatar.jsx,src/components/createOrder/FormField.jsx,src/components/orders/CustomerLogo.jsx,src/components/orders/Cell.jsx,src/components/orders/PageBtn.jsx,src/components/orders/SortableHeader.jsx

# Coverage from vitest --coverage (lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Reasonable defaults for new code in a Vite/React project
sonar.sourceEncoding=UTF-8
