# SonarQube scanner config for the frontend.
# Defaults assume a SonarQube running on localhost:9000.
# Override via env vars on CI, e.g. SONAR_HOST_URL, SONAR_TOKEN.

sonar.projectKey=woms-frontend
sonar.projectName=WOMS Frontend
sonar.organization=yayoruneko

# Source layout
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.{js,jsx},src/**/*.integration.test.{js,jsx}

# What to skip from coverage / duplication
sonar.exclusions=src/**/*.test.{js,jsx},src/**/*.integration.test.{js,jsx},src/test/**,src/data/**,src/main.jsx,src/i18n/dictionaries/**

# Coverage from vitest --coverage (lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Reasonable defaults for new code in a Vite/React project
sonar.sourceEncoding=UTF-8
