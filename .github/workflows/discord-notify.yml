name: Discord Notifications

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    branches:
      - develop
      - main

jobs:
  notify-pr-to-develop:
    name: Notify PR to develop
    if: github.event.pull_request.base.ref == 'develop' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Send PR review notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"📝 **有 PR 等待 review → develop**\nRepository: ${{ github.repository }}\nTitle: ${{ github.event.pull_request.title }}\nAuthor: ${{ github.event.pull_request.user.login }}\nSource branch: ${{ github.event.pull_request.head.ref }}\nLink: ${{ github.event.pull_request.html_url }}\"
               }" \
               "${{ secrets.DISCORD_FEATURE_WEBHOOK }}"

  notify-develop-merged:
    name: Notify develop merge
    if: github.event.pull_request.base.ref == 'develop' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send develop merge notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"✅ **develop 已 merge**\nRepository: ${{ github.repository }}\nTitle: ${{ github.event.pull_request.title }}\nMerged by: ${{ github.actor }}\nFrom: ${{ github.event.pull_request.head.ref }} → develop\nLink: ${{ github.event.pull_request.html_url }}\"
               }" \
               "${{ secrets.DISCORD_DEVELOP_WEBHOOK }}"

  notify-main-merged:
    name: Notify main merge
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send main merge notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{
                 \"content\": \"🚀 **main 已 merge**\nRepository: ${{ github.repository }}\nTitle: ${{ github.event.pull_request.title }}\nMerged by: ${{ github.actor }}\nFrom: ${{ github.event.pull_request.head.ref }} → main\nLink: ${{ github.event.pull_request.html_url }}\"
               }" \
               "${{ secrets.DISCORD_MAIN_WEBHOOK }}"
