name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (manual run only)'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

permissions:
  contents: read

env:
  GHCR_OWNER: matthew-hms

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.context.outputs.sha }}
      environment: ${{ steps.context.outputs.environment }}
    steps:
      - name: Determine context (sha + environment)
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              echo "environment=production" >> $GITHUB_OUTPUT
            else
              echo "environment=staging" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/wafer-order-backend:${{ steps.context.outputs.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/wafer-order-backend:${{ steps.context.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/wafer-order-frontend:${{ steps.context.outputs.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/wafer-order-frontend:${{ steps.context.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to k8s
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check kubeconfig secret presence
        id: gate
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::notice::KUBECONFIG_B64 secret not set — skipping deploy. Configure it after cluster is up."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}

      - uses: azure/setup-kubectl@v4
        if: steps.gate.outputs.skip != 'true'

      - name: Install kustomize
        if: steps.gate.outputs.skip != 'true'
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy via kustomize
        if: steps.gate.outputs.skip != 'true'
        env:
          ENV: ${{ needs.build-and-push.outputs.environment }}
          SHA: ${{ needs.build-and-push.outputs.sha }}
          OWNER: ${{ env.GHCR_OWNER }}
        run: |
          cd k8s/overlays/$ENV
          kustomize edit set image \
            backend=ghcr.io/$OWNER/wafer-order-backend:$SHA \
            frontend=ghcr.io/$OWNER/wafer-order-frontend:$SHA
          kubectl apply -k .
          kubectl -n $ENV rollout status deployment/backend  --timeout=5m
          kubectl -n $ENV rollout status deployment/frontend --timeout=5m
