name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test

  frontend-tests:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

  fe-be-integration:
    name: Frontend ↔ Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend (H2 test profile)
        run: |
          mvn -B -f backend/pom.xml -DskipTests -Dspring-boot.run.useTestClasspath=true -Dspring-boot.run.profiles=test spring-boot:run &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8080/api/orders > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run integration tests
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api
        run: npm run test:integration
