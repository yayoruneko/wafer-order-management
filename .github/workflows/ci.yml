name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test

  backend-mysql-tests:
    name: Backend tests (MySQL)
    if: |
      (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: woms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests (against MySQL)
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/woms_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_SQL_INIT_MODE: never
        run: mvn -B -f backend/pom.xml test

  frontend-tests:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test

  fe-be-integration:
    name: Frontend ↔ Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          mvn -B -DskipTests -Dspring-boot.build-image.skip=true package

      - name: Start backend (H2 test profile)
        working-directory: backend
        run: |
          nohup java -jar -Dspring.profiles.active=test target/backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        working-directory: backend
        run: |
          for i in {1..150}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/orders || true)
            if [ "$status_code" != "000" ]; then
              echo "Backend is responding (HTTP $status_code)"
              exit 0
            fi

            if [ -f backend.pid ] && ! ps -p "$(cat backend.pid)" > /dev/null 2>&1; then
              echo "Backend process exited early"
              echo "--- backend.log (tail) ---"
              tail -n 200 backend.log || true
              exit 1
            fi

            sleep 2
          done

          echo "Backend did not start in time"
          echo "--- backend.log (tail) ---"
          tail -n 200 backend.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run integration tests
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api
        run: npm run test:integration
