# Test profile: in-memory H2 (useful for CI integration jobs)
spring.datasource.url=jdbc:h2:mem:woms_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# MySQL-specific schema.sql uses ENUM/ON UPDATE; rely on JPA schema in this profile
spring.sql.init.mode=never
