spring.application.name=backend

# =====================
# server
# =====================
server.port=${SERVER_PORT:8080}

# =====================
# swagger設定  http://localhost:8080/swagger-ui.html
# =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true

# =====================
# Datasource (MySQL in Docker)
# =====================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/woms?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# =====================
# JDBC settings
# =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
