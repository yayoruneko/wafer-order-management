# Test profile: in-memory H2 so tests/CI don't require MySQL
spring.datasource.url=jdbc:h2:mem:woms_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Don't hard-code hibernate dialect here.
# Let Hibernate infer it from JDBC metadata so the same test profile can run
# against either H2 (default) or MySQL (CI mysql job overrides datasource).

# Don't run schema.sql/data.sql (MySQL-specific schema uses ENUM/ON UPDATE)
spring.sql.init.mode=never
# 1.讓 ClientRegistrationRepository 順利建立
spring.security.oauth2.client.registration.google.client-id=mock-client-id-for-test-environments
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret-for-test
spring.security.oauth2.client.registration.google.scope=email, profile

# 2. 強制測試環境使用 H2 記憶體資料庫 
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. 讓 Hibernate自動幫測試環境建表
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never