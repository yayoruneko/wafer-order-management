# Test profile: use in-memory H2 so CI doesn't require MySQL
spring.datasource.url=jdbc:h2:mem:woms_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Don't run schema.sql/data.sql (MySQL-specific schema uses ENUM/ON UPDATE)
spring.sql.init.mode=never
